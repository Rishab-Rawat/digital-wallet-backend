services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_dev_only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["wallet_pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: wallet_dev_only
      WALLET_SEED_DEMO: "true"
      WALLET_LLM_MODE: mock
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  wallet_pgdata:
